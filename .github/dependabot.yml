# Weekly, grouped dependency updates. Security advisories still open their own PRs
# immediately. Pair with the CI audit gate (pnpm audit --prod --audit-level=high).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    # Mirrors pnpm minimumReleaseAge: a release must be three days old before it is proposed.
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'
